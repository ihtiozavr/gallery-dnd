<html lang="ru">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Коллаж dnd</title>

<style>
/* Layout: layout tabs on top, three galleries side by side for comparing drop-slot styles */
:root{
  --bg:#f6f6f9; --fg:#24232c; --muted:#6f6d7c; --line:#e3e2ea;
  --accent:#7b62f8; --accent-pale:#e6e0fe; --tile:#ecebf2; --arrow:rgba(36,35,44,.55);
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161d; --fg:#ecebf3; --muted:#9a98aa; --line:#2e2d38; --accent:#9a86ff; --accent-pale:#352e5c; --tile:#24232c; --arrow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161d; --fg:#ecebf3; --muted:#9a98aa; --line:#2e2d38; --accent:#9a86ff; --accent-pale:#352e5c; --tile:#24232c; --arrow:rgba(0,0,0,.6); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.hint{color:var(--muted);margin:0;max-width:72ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:48px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col h2{font-size:15px;font-weight:600;margin:0}
.col p{margin:0;color:var(--muted);font-size:13px}
.view{position:relative;outline:2px solid var(--accent);border-radius:2px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;transition:height .32s cubic-bezier(.2,.7,.2,1)}
.track{position:absolute;inset:0 auto auto 0;height:100%;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.track.live{transition:none}
.tile{position:absolute;border-radius:4px;overflow:hidden;background:var(--tile);cursor:grab;
  transition:left .32s cubic-bezier(.2,.7,.2,1),top .32s cubic-bezier(.2,.7,.2,1),width .32s cubic-bezier(.2,.7,.2,1),height .32s cubic-bezier(.2,.7,.2,1)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.s-line .tile.placeholder img{opacity:.5}
.s-line .tile.placeholder{background:transparent}
.dropline{position:absolute;background:var(--accent);opacity:.6;border-radius:1px;pointer-events:none;z-index:2}
.s-purple .tile.placeholder{background:var(--accent-pale)}
.s-purple .tile.placeholder img{opacity:0}
.arrow{position:absolute;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:50%;border:0;background:var(--arrow);color:#fff;font-size:18px;line-height:32px;text-align:center;cursor:pointer;z-index:3;padding:0}
.arrow.left{left:8px}.arrow.right{right:8px}
.ghost{position:fixed;z-index:20;pointer-events:none;border-radius:4px;overflow:hidden;opacity:.5;box-shadow:0 8px 20px rgba(20,16,50,.2)}
.ghost img{width:100%;height:100%;object-fit:cover;display:block}
body.dragging,body.dragging .tile{cursor:grabbing}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.order{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.order b{color:var(--fg);font-weight:400}
.bar button{font:inherit;font-size:13px;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.bar button:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.tile,.track,.view{transition:none}}
</style>

<div class="wrap">

const NAMES={coffee:"A",book:"B",boat:"C",flower:"D",plant:"E",cup:"F"};
const START=["coffee","book","boat","flower","plant","cup"];
const GAP=12;
const STYLES=[
  {id:"line",kind:"line",title:"",text:""}
];
const MODES={
  collage:{name:"Коллаж",axis:"x",layout(ord,W){
    const MIN=W>=560?150:110,MAXL=W>=560?260:200,rows=[];let cur=[];
    const h=r=>(W-GAP*(r.length-1))/r.reduce((s,k)=>s+IMGS[k].ar,0);
    for(const k of ord){const t=[...cur,k];if(cur.length&&h(t)<MIN){rows.push(cur);cur=[k];}else cur=t;}
    if(cur.length)rows.push(cur);
    const pos={};let y=0;
    rows.forEach((r,i)=>{let rh=h(r);let x=0;
      r.forEach(k=>{const w=IMGS[k].ar*rh;pos[k]={x,y,w,h:rh};x+=w+GAP;});y+=rh+GAP;});
    return {pos,height:y-GAP,width:W};}},
  fixed:{name:"Фиксированные размеры",axis:"x",layout(ord,W){
    const C=(W-2*GAP)/3,pos={};
    ord.forEach((k,i)=>{pos[k]={x:(i%3)*(C+GAP),y:Math.floor(i/3)*(C+GAP),w:C,h:C};});
    const rows=Math.ceil(ord.length/3);return {pos,height:rows*C+(rows-1)*GAP,width:W};}},
  multi:{name:"Многоколоночная лента",axis:"y",layout(ord,W){
    const cols=3,C=(W-2*GAP)/3,per=Math.ceil(ord.length/cols),pos={};let H=0;
    for(let c=0;c<cols;c++){let y=0;ord.slice(c*per,c*per+per).forEach(k=>{const h=C/IMGS[k].ar;pos[k]={x:c*(C+GAP),y,w:C,h};y+=h+GAP;});H=Math.max(H,y-GAP);}
    return {pos,height:H,width:W};}},
  lenta:{name:"Лента",axis:"x",scroll:true,layout(ord){
    const S=180,pos={};ord.forEach((k,i)=>{pos[k]={x:i*(S+GAP),y:0,w:S,h:S};});
    return {pos,height:S,width:ord.length*(S+GAP)-GAP};}}
};
let mode='collage',drag=null,press=null;
const galleries=[];

class Gallery{
  constructor(style,host){
    this.kind=style.kind;this.order=[...START];this.scrollX=0;this.L=null;this.tiles={};
    const col=document.createElement('div');col.className='col';
    if(style.title)col.innerHTML='<h2>'+style.title+'</h2><p>'+style.text+'</p>';
    this.view=document.createElement('div');this.view.className='view s-'+style.id;this.view.setAttribute('aria-label','Галерея');
    this.track=document.createElement('div');this.track.className='track';this.view.appendChild(this.track);
    this.line=document.createElement('div');this.line.className='dropline';this.line.hidden=true;this.track.appendChild(this.line);
    for(const k of START){const d=document.createElement('div');d.className='tile';d.innerHTML='<img alt="" src="'+IMGS[k].src+'">';this.track.appendChild(d);this.tiles[k]=d;
      d.addEventListener('pointerdown',e=>{if(e.button!==0||drag)return;press={g:this,k,x:e.clientX,y:e.clientY};d.setPointerCapture(e.pointerId);});}
    this.arrows={};
    ['l','r'].forEach(s=>{const b=document.createElement('button');b.type='button';b.className='arrow '+(s==='l'?'left':'right');b.textContent=s==='l'?'‹':'›';
      b.setAttribute('aria-label',s==='l'?'Прокрутить назад':'Прокрутить вперёд');
      b.addEventListener('click',()=>this.setScroll(this.scrollX+(s==='l'?-1:1)*this.view.clientWidth*0.8));this.view.appendChild(b);this.arrows[s]=b;});
    const bar=document.createElement('div');bar.className='bar';
    this.orderEl=document.createElement('div');this.orderEl.className='order';
    const reset=document.createElement('button');reset.type='button';reset.textContent='Сбросить порядок';
    reset.addEventListener('click',()=>{this.order=[...START];this.scrollX=0;this.render();});
    bar.append(this.orderEl,reset);col.append(this.view,bar);host.appendChild(col);
    new ResizeObserver(()=>{if(!drag||drag.g!==this)this.render();}).observe(this.view);
  }
  maxScroll(){return Math.max(0,(this.L?this.L.width:0)-this.view.clientWidth);}
  setScroll(v,live){this.scrollX=Math.min(Math.max(0,v),this.maxScroll());this.track.classList.toggle('live',!!live);this.track.style.transform='translateX('+(-this.scrollX)+'px)';this.updateArrows();}
  updateArrows(){if(!MODES[mode].scroll){this.arrows.l.hidden=this.arrows.r.hidden=true;return;}
    this.arrows.l.hidden=this.scrollX<=0.5;this.arrows.r.hidden=this.scrollX>=this.maxScroll()-0.5;}
  render(){
    const M=MODES[mode];this.L=M.layout(this.order,this.view.clientWidth);
    this.view.style.height=this.L.height+'px';this.track.style.width=this.L.width+'px';
    for(const k of this.order){const p=this.L.pos[k],t=this.tiles[k];t.style.left=p.x+'px';t.style.top=p.y+'px';t.style.width=p.w+'px';t.style.height=p.h+'px';}
    const isDrag=drag&&drag.g===this;
    if(!M.scroll)this.setScroll(0);else this.setScroll(this.scrollX,isDrag);
    this.orderEl.innerHTML='Порядок: '+this.order.map(k=>isDrag&&k===drag.key?'<b>['+NAMES[k]+']</b>':NAMES[k]).join(' ');
  }
}

const grid=document.getElementById('grid');
STYLES.forEach(s=>galleries.push(new Gallery(s,grid)));

const tabs=document.getElementById('tabs');
for(const [id,m] of Object.entries(MODES)){const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=m.name;b.dataset.id=id;
  b.addEventListener('click',()=>{if(drag)return;mode=id;galleries.forEach(g=>{g.order=[...START];g.scrollX=0;g.render();});
    [...tabs.children].forEach(x=>x.setAttribute('aria-selected',x.dataset.id===id));});tabs.appendChild(b);}
tabs.children[0].setAttribute('aria-selected','true');

window.addEventListener('pointermove',e=>{
  if(press&&!drag){if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>4)beginDrag(e);else return;}
  if(drag){drag.px=e.clientX;drag.py=e.clientY;moveGhost();hitTest();}});
window.addEventListener('pointerup',()=>{press=null;if(drag)endDrag(false);});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag)endDrag(true);});

function beginDrag(e){
  const G=press.g,k=press.k,r=G.tiles[k].getBoundingClientRect();
  const gh=document.createElement('div');gh.className='ghost';gh.innerHTML='<img alt="" src="'+IMGS[k].src+'">';
  Object.assign(gh.style,{width:r.width+'px',height:r.height+'px',left:r.left+'px',top:r.top+'px'});document.body.appendChild(gh);
  drag={g:G,key:k,ghost:gh,dx:e.clientX-r.left,dy:e.clientY-r.top,origin:[...G.order],last:null,lock:0,px:e.clientX,py:e.clientY,timer:null};
  G.tiles[k].classList.add('placeholder');document.body.classList.add('dragging');G.render();
  if(MODES[mode].scroll)drag.timer=setInterval(autoScroll,16);
}
function moveGhost(){drag.ghost.style.left=(drag.px-drag.dx)+'px';drag.ghost.style.top=(drag.py-drag.dy)+'px';}
function autoScroll(){
  const G=drag.g,b=G.view.getBoundingClientRect(),EDGE=48;if(drag.py<b.top||drag.py>b.bottom)return;
  let v=0;if(drag.px>b.right-EDGE&&drag.px<=b.right+EDGE)v=Math.min(1,(drag.px-(b.right-EDGE))/EDGE);
  else if(drag.px<b.left+EDGE&&drag.px>=b.left-EDGE)v=-Math.min(1,((b.left+EDGE)-drag.px)/EDGE);
  if(v){const before=G.scrollX;G.setScroll(G.scrollX+v*9,true);if(G.scrollX!==before){drag.last=null;hitTest();}}
}
function hitTest(){
  const G=drag.g,b=G.view.getBoundingClientRect(),inside=drag.px>=b.left&&drag.px<=b.right&&drag.py>=b.top&&drag.py<=b.bottom;
  if(!inside){if(G.kind==='line'){G.line.hidden=true;drag.target=null;}else if(G.order.join()!==drag.origin.join()){G.order=[...drag.origin];G.render();}drag.last=null;return;}
  if(performance.now()<drag.lock)return;
  const x=drag.px-b.left+G.scrollX,y=drag.py-b.top,ax=MODES[mode].axis;let hit=null;
  for(const k of G.order){const p=G.L.pos[k],pad=GAP/2;if(x>=p.x-pad&&x<=p.x+p.w+pad&&y>=p.y-pad&&y<=p.y+p.h+pad){hit=k;break;}}
  if(!hit||hit===drag.key){if(G.kind==='line'&&hit===drag.key){G.line.hidden=true;drag.target=null;}return;}
  const p=G.L.pos[hit],side=(ax==='x'?x<p.x+p.w/2:y<p.y+p.h/2)?'before':'after',sig=hit+side;
  if(sig===drag.last)return;drag.last=sig;
  const others=G.order.filter(k=>k!==drag.key),i=others.indexOf(hit)+(side==='after'?1:0);
  const next=[...others.slice(0,i),drag.key,...others.slice(i)];
  if(G.kind==='line'){
    if(next.join()===G.order.join()){G.line.hidden=true;drag.target=null;return;}
    drag.target=next;const l=G.line;l.hidden=false;
    if(ax==='x'){const lx=Math.min(Math.max(side==='before'?p.x-GAP/2:p.x+p.w+GAP/2,1),G.L.width-1);Object.assign(l.style,{left:(lx-1)+'px',top:(p.y+4)+'px',width:'2px',height:(p.h-8)+'px'});}
    else{const ly=Math.min(Math.max(side==='before'?p.y-GAP/2:p.y+p.h+GAP/2,1),G.L.height-1);Object.assign(l.style,{left:(p.x+4)+'px',top:(ly-1)+'px',width:(p.w-8)+'px',height:'2px'});}
    return;}
  if(next.join()===G.order.join())return;
  G.order=next;G.render();drag.lock=performance.now()+180;
}
function endDrag(cancel){
  clearInterval(drag.timer);const G=drag.g;if(cancel)G.order=[...drag.origin];else if(G.kind==='line'&&drag.target)G.order=drag.target;G.line.hidden=true;
  const k=drag.key,gh=drag.ghost,t=G.tiles[k];drag=null;press=null;G.render();
  const vb=G.view.getBoundingClientRect(),p=G.L.pos[k];
  gh.style.transition='left .25s ease-out,top .25s ease-out,width .25s ease-out,height .25s ease-out';
  Object.assign(gh.style,{left:(vb.left+p.x-G.scrollX)+'px',top:(vb.top+p.y)+'px',width:p.w+'px',height:p.h+'px'});
  document.body.classList.remove('dragging');
  setTimeout(()=>{gh.remove();t.classList.remove('placeholder');},matchMedia('(prefers-reduced-motion:reduce)').matches?0:260);
}
galleries.forEach(g=>g.render());
</script>
